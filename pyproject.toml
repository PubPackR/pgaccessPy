[project]
name = "pgaccess"
version = "0.1.1"
description = "Authenticated PostgreSQL access for Studyflix Python base apps (the Python twin of Billomatics::postgres_connect)."
readme = "README.md"
# Matches the production interpreter on shiny.studyflix.info (/usr/bin/python3 == 3.12.3).
requires-python = ">=3.12"
dependencies = [
    # Pinned to the versions confirmed installed on shiny.studyflix.info, because
    # production consumes this package as a git submodule with no install step --
    # the host's hand-installed packages are what actually get imported.
    "cryptography==46.0.4",
    "psycopg2-binary==2.9.10",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pgaccess"]

[tool.pyright]
include = ["pgaccess"]
ignore = ["tests"]  # fake-based tests are intentionally untyped
typeCheckingMode = "basic"
reportMissingModuleSource = false
